<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giao Diện Bài Giảng & Video Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #1a1a2e;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Layout Chia Đôi Màn Hình */
    .app-container {
      display: flex;
      flex: 1;
      height: 100vh;
      width: 100vw;
    }

    .column-left, .column-right {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #2a2a4a;
      overflow-y: auto;
    }

    .column-right {
      border-right: none;
      background-color: #161626;
    }

    /* Video Player Container & Overlay */
    .video-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* Ratio 16:9 */
      background-color: #000;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Lớp phủ vô hiệu hóa toàn bộ click trực tiếp vào YouTube */
    .iframe-blocker {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: calc(100% - 40px); /* Để hở phần Custom Control bên dưới */
      z-index: 10;
      background: transparent;
    }

    /* Thanh điều khiển Custom Video Control */
    .custom-controls {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 48px;
      background: rgba(15, 15, 26, 0.95);
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 10px;
      z-index: 20;
    }

    .control-btn {
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      font-size: 13px;
      padding: 4px 8px;
      border-radius: 4px;
      transition: background 0.2s;
    }

    .control-btn:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }

    .progress-bar {
      flex: 1;
      height: 5px;
      background: #4a4a6a;
      cursor: pointer;
      position: relative;
      border-radius: 3px;
    }

    .progress-filled {
      width: 0%;
      height: 100%;
      background: #e94560;
      border-radius: 3px;
    }

    select.control-select {
      background: #2a2a4a;
      color: #fff;
      border: none;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }

    /* Khu vực thông tin & Danh sách tài liệu (Cột Trái) */
    .lecture-info {
      padding: 15px;
      flex: 1;
    }

    .section-title {
      font-weight: bold;
      color: #00adb5;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .doc-list {
      list-style: none;
      margin-top: 10px;
    }

    .doc-item {
      padding: 8px 12px;
      margin-bottom: 6px;
      background: #22223b;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid transparent;
    }

    .doc-item:hover, .doc-item.active {
      border-color: #00adb5;
      background: #2a2a4a;
    }

    /* Khung hiển thị tài liệu PDF (Cột Phải) */
    .doc-viewer-container {
      flex: 2;
      border-bottom: 1px solid #2a2a4a;
      background: #ffffff;
    }

    .doc-viewer-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Khung thảo luận (Cột Phải) */
    .discussion-container {
      flex: 1;
      padding: 15px;
      display: flex;
      flex-direction: column;
    }

    .discussion-input {
      width: 100%;
      padding: 10px;
      background: #22223b;
      border: 1px solid #4a4a6a;
      border-radius: 4px;
      color: #fff;
      margin-top: 10px;
      resize: none;
    }
  </style>
</head>
<body>

  <div class="app-container" id="playerContainer">
    <!-- CỘT TRÁI: VIDEO & NỘI DUNG BÀI GIẢNG -->
    <div class="column-left">
      <div class="video-wrapper">
        <!-- Khung nhúng YouTube Player -->
        <div id="youtube-player"></div>
        
        <!-- Lớp phủ ngăn click trực tiếp vào Logo/Link YouTube -->
        <div class="iframe-blocker"></div>

        <!-- Bộ điều khiển Tùy chỉnh (Custom Video Controls) -->
        <div class="custom-controls">
          <button class="control-btn" id="btnPlay">►</button>
          <button class="control-btn" onclick="seekRelative(-10)">-10s</button>
          <button class="control-btn" onclick="seekRelative(10)">+10s</button>
          
          <div class="progress-bar" id="progressBar">
            <div class="progress-filled" id="progressFilled"></div>
          </div>
          
          <!-- Thay đổi tốc độ phát -->
          <select class="control-select" id="speedSelect" onchange="changeSpeed(this.value)">
            <option value="0.5">0.5x</option>
            <option value="1" selected>1.0x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2.0x</option>
          </select>

          <!-- Thay đổi độ phân giải -->
          <select class="control-select" id="qualitySelect" onchange="changeQuality(this.value)">
            <option value="default" selected>Auto</option>
            <option value="small">360p</option>
            <option value="large">720p</option>
            <option value="hd1080">1080p</option>
          </select>

          <!-- Bật/Tắt Phụ đề -->
          <button class="control-btn" onclick="toggleCaptions()">CC</button>

          <!-- Phóng to/Thu nhỏ màn hình -->
          <button class="control-btn" onclick="toggleFullScreen()">[ ]</button>
        </div>
      </div>

      <!-- Thông tin & Danh sách nhiều tài liệu -->
      <div class="lecture-info">
        <div class="section-title">Lịch sử làm bài & Bài tập</div>
        <p style="font-size: 12px; color: #aaa;">Đã làm: 1/20 lượt | Lần cuối: 2 tháng trước</p>
        
        <div class="section-title" style="margin-top: 15px;">Tài liệu đi kèm bài học</div>
        <ul class="doc-list" id="docList">
          <!-- Render danh sách tài liệu động -->
        </ul>
      </div>
    </div>

    <!-- CỘT PHẢI: TRÌNH XEM TÀI LIỆU & THẢO LUẬN -->
    <div class="column-right">
      <!-- Khung hiển thị tài liệu PDF chọn từ cột trái -->
      <div class="doc-viewer-container">
        <iframe id="pdfViewer" src="https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf"></iframe>
      </div>

      <!-- Khung Thảo luận -->
      <div class="discussion-container">
        <div class="section-title">Thảo luận bài giảng</div>
        <textarea class="discussion-input" rows="3" placeholder="Viết bình luận..."></textarea>
      </div>
    </div>
  </div>

  <!-- Tải API YouTube IFrame -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    // Dữ liệu mô phỏng danh sách tài liệu trong 1 bài giảng
    const lectureDocuments = [
      { id: 1, name: "[Tài liệu] Theme 7.pdf", url: "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf" },
      { id: 2, name: "[Ghi chép] Theme 7.pdf", url: "https://pdfobject.com/pdf/sample.pdf" },
      { id: 3, name: "[Handout] VD Theme 7.pdf", url: "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf" }
    ];

    let player;
    let isCaptionsOn = false;

    // Khởi tạo YouTube Player khi API sẵn sàng
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('youtube-player', {
        videoId: 'M7lc1UVf-VE', // Mã video mẫu
        playerVars: {
          'controls': 0,          // Tắt thanh điều khiển mặc định của YouTube
          'disablekb': 1,          // Tắt phím tắt mặc định
          'modestbranding': 1,   // Tối giản Logo YouTube
          'rel': 0,               // Không hiện video liên quan
          'showinfo': 0,
          'fs': 0
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerReady(event) {
      // Cập nhật tiến trình video liên tục
      setInterval(updateProgressBar, 500);
      
      // Xử lý nút Play/Pause
      document.getElementById('btnPlay').addEventListener('click', function() {
        const state = player.getPlayerState();
        if (state === YT.PlayerState.PLAYING) {
          player.pauseVideo();
        } else {
          player.playVideo();
        }
      });
    }

    function onPlayerStateChange(event) {
      const btnPlay = document.getElementById('btnPlay');
      if (event.data === YT.PlayerState.PLAYING) {
        btnPlay.innerText = '❚❚';
      } else {
        btnPlay.innerText = '►';
      }
    }

    // Các hàm tính năng Video tùy chỉnh
    function seekRelative(seconds) {
      const currentTime = player.getCurrentTime();
      player.seekTo(currentTime + seconds, true);
    }

    function changeSpeed(val) {
      player.setPlaybackRate(parseFloat(val));
    }

    function changeQuality(val) {
      player.setPlaybackQuality(val);
    }

    function toggleCaptions() {
      isCaptionsOn = !isCaptionsOn;
      if (isCaptionsOn) {
        player.loadModule("captions");
      } else {
        player.unloadModule("captions");
      }
    }

    function updateProgressBar() {
      if (player && player.getDuration) {
        const duration = player.getDuration();
        const currentTime = player.getCurrentTime();
        if (duration > 0) {
          const percentage = (currentTime / duration) * 100;
          document.getElementById('progressFilled').style.width = percentage + '%';
        }
      }
    }

    // Tua video khi click vào thanh tiến trình
    document.getElementById('progressBar').addEventListener('click', function(e) {
      const rect = this.getBoundingClientRect();
      const pos = (e.clientX - rect.left) / rect.width;
      if (player && player.getDuration) {
        player.seekTo(pos * player.getDuration(), true);
      }
    });

    // Phóng to / Thu nhỏ màn hình (Fullscreen)
    function toggleFullScreen() {
      const elem = document.getElementById('playerContainer');
      if (!document.fullscreenElement) {
        elem.requestFullscreen().catch(err => alert(err.message));
      } else {
        document.exitFullscreen();
      }
    }

    // Hiển thị danh sách và xử lý chuyển đổi nhiều tài liệu
    function renderDocumentList() {
      const docListEl = document.getElementById('docList');
      docListEl.innerHTML = '';

      lectureDocuments.forEach((doc, index) => {
        const li = document.createElement('li');
        li.className = `doc-item ${index === 0 ? 'active' : ''}`;
        li.innerHTML = `<span>📄 ${doc.name}</span> <span>⬇</span>`;
        li.onclick = () => {
          document.querySelectorAll('.doc-item').forEach(item => item.classList.remove('active'));
          li.classList.add('active');
          document.getElementById('pdfViewer').src = doc.url;
        };
        docListEl.appendChild(li);
      });
    }

    // Khởi chạy khi tải trang hoàn tất
    window.onload = function() {
      renderDocumentList();
    };
  </script>
</body>
</html>
