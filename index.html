<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KHÓA HỌC TRỰC TUYẾN - HỆ THỐNG ĐÀO TẠO</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script src="https://www.youtube.com/iframe_api"></script>

  <style>
    :root {
      --bg-dark: #12141d;
      --bg-sidebar-left: #6c5ce7;
      --bg-panel: #1a1d29;
      --bg-card: #222636;
      --bg-hover: #2d3247;
      --primary: #8c7ae6;
      --primary-bright: #a29bfe;
      --accent-green: #00b894;
      --danger: #e74c3c;
      --warning: #f39c12;
      --text-main: #f5f6fa;
      --text-muted: #8c93a8;
      --border: rgba(255, 255, 255, 0.05);
      --font-family: 'Inter', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-family); background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; overflow-x: hidden; }

    /* MÀN HÌNH ĐĂNG NHẬP */
    #loginScreen {
      display: flex; justify-content: center; align-items: center; min-height: 100vh;
      background: radial-gradient(circle at center, #1a1d29 0%, #12141d 100%);
    }
    .login-card {
      background: var(--bg-panel); border: 1px solid var(--border);
      padding: 40px; border-radius: 20px; width: 100%; max-width: 420px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .login-card h2 { text-align: center; color: var(--primary-bright); margin-bottom: 24px; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: var(--text-muted); }
    .form-group input, .form-group select {
      width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--bg-dark); color: #fff; outline: none; font-family: var(--font-family);
    }
    .btn-submit {
      width: 100%; padding: 12px; background: var(--bg-sidebar-left); color: #fff; border: none;
      border-radius: 10px; font-weight: 600; cursor: pointer; font-family: var(--font-family); transition: 0.2s;
    }

    /* BẢNG ĐIỀU KHIỂN CHÍNH */
    #appScreen { display: none; height: 100vh; }
    .app-container { display: flex; height: 100vh; overflow: hidden; }

    .icon-sidebar {
      width: 70px; background-color: var(--bg-sidebar-left); display: flex; flex-direction: column;
      align-items: center; padding: 20px 0; justify-content: space-between; flex-shrink: 0; z-index: 20;
    }
    .icon-group { display: flex; flex-direction: column; gap: 24px; align-items: center; }
    .nav-icon {
      font-size: 1.3rem; color: rgba(255, 255, 255, 0.7); cursor: pointer; transition: 0.2s;
      width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px;
    }
    .nav-icon:hover, .nav-icon.active { color: #fff; background-color: rgba(255, 255, 255, 0.2); }

    /* SUB SIDEBAR VÀ NÚT THU GỌN */
    .sub-sidebar {
      width: 260px; background-color: var(--bg-panel); border-right: 1px solid var(--border);
      padding: 24px 16px; display: flex; flex-direction: column; gap: 12px; flex-shrink: 0; overflow-y: auto;
      transition: all 0.3s ease; position: relative;
    }
    .sub-sidebar.collapsed {
      width: 0; padding: 24px 0; overflow: hidden; border-right: none;
    }
    .sub-sidebar-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
    }
    .sub-sidebar-title { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; }
    
    .toggle-sidebar-btn {
      background: var(--bg-hover); color: var(--primary-bright); border: 1px solid var(--border);
      width: 28px; height: 28px; border-radius: 6px; cursor: pointer; display: flex;
      align-items: center; justify-content: center; font-size: 0.8rem; transition: 0.2s; flex-shrink: 0;
    }
    .toggle-sidebar-btn:hover { background: var(--primary); color: #fff; }

    .sub-nav-btn {
      padding: 12px; border-radius: 10px; color: var(--text-muted); background: transparent; border: none;
      text-align: left; font-size: 0.9rem; cursor: pointer; font-family: var(--font-family); transition: 0.2s; font-weight: 500; white-space: nowrap;
    }
    .sub-nav-btn:hover, .sub-nav-btn.active { background: var(--bg-card); color: #fff; font-weight: 600; }

    .main-content { flex-grow: 1; padding: 32px; overflow-y: auto; background-color: var(--bg-dark); }
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
    .page-title-box { display: flex; align-items: center; gap: 12px; }
    .page-title { font-size: 1.6rem; font-weight: 700; color: var(--text-main); }

    /* Ô KÍCH HOẠT KHÓA HỌC */
    .activation-box {
      background: var(--bg-panel); border: 1px solid var(--primary); border-radius: 16px; padding: 20px; margin-bottom: 24px;
      display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    }
    .activation-box input {
      flex-grow: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--bg-dark); color: #fff; outline: none; font-family: var(--font-family);
    }

    /* DASHBOARD ADMIN */
    .stats-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 24px; }
    .stat-card { background: var(--bg-panel); border-radius: 16px; padding: 24px; border: 1px solid var(--border); margin-bottom: 16px; }
    .stat-big-num { font-size: 2rem; font-weight: 700; color: #fff; margin: 10px 0; }
    .badge-percent { display: inline-block; background: var(--bg-sidebar-left); color: #fff; padding: 8px 16px; border-radius: 10px; font-weight: 700; font-size: 1.1rem; }

    .data-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    .data-table th, .data-table td { text-align: left; padding: 14px 16px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    .data-table th { color: var(--text-muted); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; }

    /* GIAO DIỆN GRID THẺ KHÓA HỌC LỚN (CARDS) */
    .big-courses-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
      margin-bottom: 24px;
    }
    .big-course-card {
      background: var(--bg-panel);
      border-radius: 16px;
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }
    .big-course-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(108, 92, 231, 0.25);
      border-color: var(--primary-bright);
    }
    .card-thumb-container {
      position: relative;
      width: 100%;
      height: 170px;
      background-color: var(--bg-card);
    }
    .card-thumb-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .card-badge-target {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(108, 92, 231, 0.9);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
    }
    .card-badge-type {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: rgba(0, 184, 148, 0.9);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
    }
    .card-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }
    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .card-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .card-price {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary-bright);
    }
    .card-admin-actions {
      display: flex;
      gap: 6px;
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px dashed var(--border);
    }

    /* BREADCRUMB BẬC CẤP KHÓA HỌC */
    .breadcrumb-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      font-size: 0.95rem;
      background: var(--bg-panel);
      padding: 12px 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .breadcrumb-item {
      color: var(--primary-bright);
      cursor: pointer;
      font-weight: 600;
    }
    .breadcrumb-item:hover { text-decoration: underline; }
    .breadcrumb-current { color: var(--text-muted); }

    /* DANH SÁCH KHÓA HỌC NHỎ VÀ CẤU TRÚC PHẦN BÀI HỌC */
    .course-card-box {
      background: var(--bg-card); border-radius: 14px; padding: 18px; border: 1px solid var(--border); margin-bottom: 16px;
    }
    .course-header {
      display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-size: 1.1rem; font-weight: 600; color: #fff;
    }
    .parts-container { display: none; margin-top: 14px; padding-left: 12px; border-left: 2px solid var(--bg-sidebar-left); }
    .parts-container.open { display: block; }

    .part-header-box {
      background: var(--bg-dark); border-radius: 10px; padding: 12px 16px; border: 1px solid var(--border);
      cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: 600; margin-bottom: 8px; margin-top: 8px; font-size: 0.95rem;
    }
    .part-header-box:hover { background: var(--bg-hover); }

    .lessons-list {
      display: none; padding: 10px 14px; background: #0c0e17; border-radius: 10px; margin-bottom: 10px; border: 1px solid var(--border);
    }
    .lessons-list.open { display: block; }
    
    .lesson-item {
      padding: 10px 14px; background: var(--bg-card); border-radius: 8px; margin-bottom: 6px;
      display
