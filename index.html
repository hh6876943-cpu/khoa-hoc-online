<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KHÓA HỌC TRỰC TUYẾN - HỆ THỐNG ĐÀO TẠO</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- FIREBASE SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <!-- YOUTUBE IFRAME API SDK -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <style>
    :root {
      --bg-dark: #12141d;
      --bg-panel: #1a1d29;
      --bg-card: #222636;
      --bg-hover: #2d3247;
      --primary: #6c5ce7;
      --primary-bright: #a29bfe;
      --accent-green: #00b894;
      --danger: #e74c3c;
      --warning: #f39c12;
      --text-main: #f5f6fa;
      --text-muted: #8c93a8;
      --border: rgba(255, 255, 255, 0.08);
      --font-family: 'Inter', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-family); background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; overflow-x: hidden; }

    /* MÀN HÌNH ĐĂNG NHẬP */
    #loginScreen {
      display: flex; justify-content: center; align-items: center; min-height: 100vh;
      background: radial-gradient(circle at center, #1a1d29 0%, #12141d 100%);
    }
    .login-card {
      background: var(--bg-panel); border: 1px solid var(--border);
      padding: 40px; border-radius: 20px; width: 100%; max-width: 420px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .login-card h2 { text-align: center; color: var(--primary-bright); margin-bottom: 24px; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: var(--text-muted); }
    .form-group input, .form-group select {
      width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--bg-dark); color: #fff; outline: none; font-family: var(--font-family);
    }
    .btn-submit {
      width: 100%; padding: 12px; background: var(--primary); color: #fff; border: none;
      border-radius: 10px; font-weight: 600; cursor: pointer; font-family: var(--font-family); transition: 0.2s;
    }

    /* BẢNG ĐIỀU KHIỂN CHÍNH */
    #appScreen { display: none; min-height: 100vh; }
    
    /* TOP NAV HEADER */
    .top-header {
      background: var(--bg-panel); height: 65px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; padding: 0 32px;
      position: sticky; top: 0; z-index: 100;
    }
    .nav-tabs { display: flex; gap: 24px; align-items: center; }
    .nav-tab-item {
      display: flex; align-items: center; gap: 8px; color: var(--text-muted); font-weight: 500;
      font-size: 0.95rem; cursor: pointer; padding: 18px 4px; border-bottom: 2px solid transparent; transition: 0.2s;
    }
    .nav-tab-item:hover, .nav-tab-item.active { color: var(--primary-bright); border-bottom-color: var(--primary-bright); }

    .header-right { display: flex; align-items: center; gap: 16px; }
    .search-input {
      background: var(--bg-dark); border: 1px solid var(--border); padding: 8px 16px;
      border-radius: 20px; color: #fff; font-size: 0.85rem; outline: none; width: 200px;
    }
    .user-avatar {
      width: 36px; height: 36px; border-radius: 50%; background: #00cec9; color: #fff;
      display: flex; align-items: center; justify-content: center; font-weight: 700; cursor: pointer;
    }

    .main-container { padding: 32px; max-width: 1400px; margin: 0 auto; }

    /* BREADCRUMB HOẶC ACTION BAR */
    .action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .btn-ctrl { background: var(--bg-card); color: #fff; border: 1px solid var(--border); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; }
    .btn-ctrl:hover { background: var(--primary); }

    /* Ô NHẬP MÃ KÍCH HOẠT */
    .activation-box {
      background: var(--bg-panel); border: 1px solid var(--primary); border-radius: 16px; padding: 18px 24px; margin-bottom: 28px;
      display: flex; gap: 12px; align-items: center;
    }
    .activation-box input {
      flex-grow: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg-dark); color: #fff; outline: none;
    }

    /* GIAO DIỆN HÌNH 1: GRID CÁC KHÓA HỌC LỚN */
    .courses-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px;
    }
    .course-card {
      background: var(--bg-panel); border-radius: 16px; overflow: hidden; border: 1px solid var(--border);
      transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; display: flex; flex-direction: column;
    }
    .course-card:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(0,0,0,0.4); border-color: var(--primary); }
    .course-thumb {
      height: 180px; width: 100%; background-size: cover; background-position: center; position: relative;
      background-color: #2d3436;
    }
    .course-card-body { padding: 18px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .course-card-title { font-size: 1.05rem; font-weight: 700; color: #fff; margin-bottom: 12px; line-height: 1.4; }
    .course-progress { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; }
    .progress-bar { height: 6px; background: var(--bg-dark); border-radius: 3px; overflow: hidden; margin-bottom: 12px; }
    .progress-fill { height: 100%; background: var(--primary-bright); width: 0%; }
    
    .course-card-footer {
      display: flex; justify-content: space-between; align-items: center; margin-top: 12px;
      padding-top: 12px; border-top: 1px dashed var(--border);
    }
    .badge-date { background: rgba(0, 184, 148, 0.15); color: var(--accent-green); padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; }
    .price-tag { color: var(--primary-bright); font-weight: 700; font-size: 0.95rem; }

    /* GIAO DIỆN CHỌN KHÓA NHỎ & BÀI HỌC */
    .subcourse-list-wrapper { background: var(--bg-panel); border-radius: 16px; padding: 24px; border: 1px solid var(--border); margin-bottom: 24px; }
    .subcourse-item { background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border); margin-bottom: 14px; overflow: hidden; }
    .subcourse-header { padding: 16px 20px; font-weight: 600; font-size: 1.05rem; cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.02); }
    .subcourse-header:hover { background: var(--bg-hover); }
    .lesson-list { display: none; padding: 12px 20px; background: #141722; border-top: 1px solid var(--border); }
    .lesson-list.open { display: block; }
    .lesson-row { padding: 10px 14px; border-radius: 8px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s; }
    .lesson-row:hover { background: var(--bg-hover); color: var(--primary-bright); }

    /* GIAO DIỆN HÌNH 2: XEM BÀI HỌC (2 CỘT MÀN HÌNH) */
    .study-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; min-height: 80vh; }
    .left-panel, .right-panel { display: flex; flex-direction: column; gap: 16px; }
    
    .media-wrapper { position: relative; padding-top: 56.25%; background: #000; border-radius: 12px; overflow: hidden; }
    .media-wrapper video, .media-wrapper iframe, .media-wrapper div#ytPlayerDiv { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    
    /* CHE TIÊU ĐỀ, LOGO KÊNH, LINK NGOẠI TÁC CỦA YOUTUBE NHƯNG GIỮ BỘ ĐIỀU KHIỂN PLAY/SEEK */
    .yt-blocker-top { position: absolute; top: 0; left: 0; width: 100%; height: 60px; z-index: 10; background: transparent; }
    .yt-blocker-bottom-right { position: absolute; bottom: 35px; right: 0; width: 100px; height: 50px; z-index: 10; background: transparent; }

    .docs-list-box { background: var(--bg-panel); border-radius: 12px; padding: 16px; border: 1px solid var(--border); }
    .doc-item-link { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: var(--bg-card); border-radius: 6px; color: var(--primary-bright); text-decoration: none; font-size: 0.85rem; margin-top: 8px; border: 1px solid var(--border); cursor: pointer; }
    .doc-item-link:hover { background: var(--bg-hover); }

    .pdf-viewer-frame { flex-grow: 1; min-height: 500px; background: var(--bg-panel); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; }
    .pdf-viewer-frame iframe { width: 100%; height: 100%; border: none; }

    .discussion-box { background: var(--bg-panel); border-radius: 12px; padding: 16px; border: 1px solid var(--border); display: flex; flex-direction: column; height: 250px; }
    .chat-messages { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; font-size: 0.85rem; }
    .chat-input-bar { display: flex; gap: 8px; }
    .chat-input-bar input { flex-grow: 1; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-dark); color: #fff; }

    /* ADMIN DASHBOARD */
    .data-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    .data-table th, .data-table td { text-align: left; padding: 12px; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
    .admin-btn-sm { background: var(--primary); color: #fff; border: none; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; margin-left: 4px; }
    .admin-btn-danger { background: var(--danger); }
  </style>
</head>
<body>

  <!-- MÀN HÌNH ĐĂNG NHẬP -->
  <div id="loginScreen">
    <div class="login-card">
      <h2>🎓 DẠY HỌC TRỰC TUYẾN</h2>
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Tài khoản</label>
          <input type="text" id="username" placeholder="admin hoặc user" required>
        </div>
        <div class="form-group">
          <label>Mật khẩu</label>
          <input type="password" id="password" placeholder="Mật khẩu" required>
        </div>
        <div class="form-group">
          <label>Mã Thiết Bị Đăng Nhập</label>
          <select id="deviceSelect">
            <option value="Device_PC_1">Máy 1 (Điện thoại/PC)</option>
            <option value="Device_Laptop_2">Máy 2 (Laptop)</option>
            <option value="Device_Phone_3">Máy 3 (Giới hạn bảo mật)</option>
          </select>
        </div>
        <button type="submit" class="btn-submit">Đăng Nhập Hệ Thống</button>
      </form>
    </div>
  </div>

  <!-- MÀN HÌNH CHÍNH -->
  <div id="appScreen">
    <!-- TOP HEADER NAVBAR -->
    <header class="top-header">
      <div class="nav-tabs">
        <div class="nav-tab-item active" onclick="switchNavTab('courses')">🎓 Khóa học</div>
        <div class="nav-tab-item" onclick="openScheduleModal()">📅 Lịch đào tạo</div>
        <div class="nav-tab-item" onclick="switchNavTab('documents')">💬 Thảo luận & Hỏi đáp</div>
        <div class="nav-tab-item" id="adminTabNav" style="display:none;" onclick="switchNavTab('admin')">📊 Dashboard Admin</div>
      </div>
      <div class="header-right">
        <input type="text" class="search-input" placeholder="Tìm kiếm khóa học...">
        <div class="user-avatar" id="userAvatarBtn" onclick="handleLogout()" title="Đăng xuất">H</div>
      </div>
    </header>

    <div class="main-container">

      <!-- SECTION 1: DANH SÁCH KHÓA HỌC LỚN (HÌNH 1) -->
      <section id="coursesSection">
        <div class="activation-box">
          <span style="font-weight: 600; color: var(--primary-bright);">🔑 Kích hoạt khóa học:</span>
          <input type="text" id="activationCodeInput" placeholder="Nhập mã kích hoạt khóa học lớn...">
          <button class="btn-ctrl" style="background: var(--accent-green); color:#000; font-weight:600;" onclick="activateCourseCode()">Kích Hoạt</button>
        </div>

        <div id="adminGlobalControls" style="display:none; margin-bottom: 20px; gap: 10px;">
          <button class="btn-ctrl" onclick="adminAddBigCourse()">+ Thêm Khóa Học Lớn Mới</button>
          <button class="btn-ctrl" style="background:var(--warning); color:#000;" onclick="resetCoursesToDefault()">🔄 Reset Dữ Liệu</button>
        </div>

        <div class="courses-grid" id="coursesGridContainer">
          <!-- Các Card Khóa học lớn sẽ render ở đây -->
        </div>
      </section>

      <!-- SECTION 2: DANH SÁCH KHÓA HỌC NHỎ VÀ BÀI HỌC -->
      <section id="subCourseSection" style="display:none;">
        <div class="action-bar">
          <button class="btn-ctrl" onclick="backToBigCourses()">◄ Quay lại danh sách khóa học</button>
          <h2 id="currentBigCourseTitle" style="color: var(--primary-bright);">Tên Khóa Học Lớn</h2>
        </div>
        <div class="subcourse-list-wrapper" id="subCoursesContainer">
          <!-- Render các khóa học nhỏ & phần bài học -->
        </div>
      </section>

      <!-- SECTION 3: MÀN HÌNH HỌC 2 CỘT (HÌNH 2) -->
      <section id="lessonStudySection" style="display:none;">
        <div class="action-bar">
          <button class="btn-ctrl" onclick="backToSubCourses()">◄ Quay lại danh sách bài</button>
          <h3 id="currentLessonTitle" style="color: #fff;">Chủ đề bài học</h3>
        </div>

        <div class="study-layout">
          <!-- CỘT TRÁI: VIDEO + DANH SÁCH NHIỀU TÀI LIỆU -->
          <div class="left-panel">
            <div class="media-wrapper" id="mediaContainerWrapper"></div>
            
            <div class="docs-list-box">
              <b style="color: var(--primary-bright); font-size: 0.9rem;">📄 Tài liệu đi kèm buổi học:</b>
              <div id="lessonDocsList">
                <!-- Danh sách nhiều tài liệu đính kèm sẽ render ở đây -->
              </div>
            </div>
          </div>

          <!-- CỘT PHẢI: XEM FILE TÀI LIỆU TRỰC TIẾP + BÌNH LUẬN -->
          <div class="right-panel">
            <div class="pdf-viewer-frame" id="pdfViewerFrame">
              <iframe id="pdfIframe" src="about:blank"></iframe>
            </div>

            <div class="discussion-box">
              <b style="margin-bottom: 8px; font-size: 0.85rem; color: var(--text-muted);">Thảo luận bài học</b>
              <div class="chat-messages" id="chatMessagesBox"></div>
              <div class="chat-input-bar">
                <input type="text" id="chatMessageInput" placeholder="Viết bình luận..." onkeypress="handleChatKeyPress(event)">
                <button class="btn-ctrl" style="background:var(--primary)" onclick="sendChatMessage()">Gửi</button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- SECTION 4: THẢO LUẬN HOẶC ADMIN DASHBOARD -->
      <section id="adminSection" style="display:none;">
        <h3>Quản Lý Hệ Thống & Người Dùng</h3>
        <br>
        <button class="btn-ctrl" onclick="adminCreateUser()">+ Tạo Tài Khoản Mới</button>
        <button class="btn-ctrl" onclick="adminCreateActivationCode()">+ Tạo Mã Kích Hoạt</button>
        <br><br>
        <table class="data-table">
          <thead>
            <tr><th>Tên học viên</th><th>Tài khoản</th><th>Thiết bị</th><th>Trạng thái</th><th>Thao tác</th></tr>
          </thead>
          <tbody id="adminUsersTable"></tbody>
        </table>
      </section>

    </div>
  </div>

  <script>
    // FIREBASE CONFIG
    const firebaseConfig = {
      apiKey: "AIzaSyCdC9u4XFa0UgM09dtn-OCPFf8EIFPXZUQ",
      authDomain: "khoa-hoc-online-f936d.firebaseapp.com",
      databaseURL: "https://khoa-hoc-online-f936d-default-rtdb.firebaseio.com",
      projectId: "khoa-hoc-online-f936d",
      storageBucket: "khoa-hoc-online-f936d.firebasestorage.app",
      messagingSenderId: "115353900067",
      appId: "1:115353900067:web:7e2ece09223a40e3108d96"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // LINK THỜI KHÓA BIỂU ĐÀO TẠO GOOGLE SHEET MẶC ĐỊNH
    let scheduleSheetUrl = "https://docs.google.com/spreadsheets/d/1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgvE2upms/preview";

    const defaultBigCoursesData = [
      {
        bigCourseId: 'VACT_BIG_999',
        bigCourseTitle: 'STEP 5 2027 | Killingcamp',
        coverImg: 'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=500',
        releaseDate: '24/05/2027',
        price: '800.000 VND',
        subCourses: [
          {
            courseId: 101,
            courseTitle: 'Khóa 1: Hàm số & Ứng dụng Đạo hàm',
            lessons: [
              {
                title: 'Theme 7. Nguyên hàm và tính chất của nguyên hàm - Buổi 1',
                videoUrl: 'https://www.youtube.com/watch?v=dQw4w9WgXcQ',
                docs: [
                  { name: '[Tài liệu] Theme 7.pdf', url: 'https://docs.google.com/document/d/1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgvE2upms/preview' },
                  { name: '[Ghi chép] Theme 7.pdf', url: 'https://docs.google.com/document/d/1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgvE2upms/preview' },
                  { name: '[Handout] VD Theme 7.pdf', url: 'https://docs.google.com/document/d/1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgvE2upms/preview' }
                ]
              }
            ]
          }
        ]
      }
    ];

    const defaultUserAccounts = [
      { id: 1, name: 'Admin Tối Cao', username: 'admin', password: 'hhh@123456', role: 'admin', devices: ['Device_PC_1'], isLocked: false, unlockedBigCourses: ['VACT_BIG_999'] },
      { id: 2, name: 'Học viên Demo', username: 'user', password: 'user123', role: 'user', devices: ['Device_PC_1'], isLocked: false, unlockedBigCourses: [] }
    ];

    let userAccounts = [];
    let bigCoursesData = [];
    let activationCodes = [];
    let currentUser = null;
    let currentBigCourseIndex = null;
    let ytPlayerInstance = null;

    // REALTIME DATABASE LISTENERS
    db.ref('users').on('value', (s) => {
      userAccounts = s.val() || defaultUserAccounts;
      if (currentUser && currentUser.role === 'admin') renderAdminUsers();
    });

    db.ref('bigCoursesData').on('value', (s) => {
      bigCoursesData = s.val() || defaultBigCoursesData;
      if (currentUser) renderCoursesGrid();
    });

    db.ref('activationCodes').on('value', (s) => { activationCodes = s.val() || []; });
    db.ref('chatMessages').on('value', (s) => { renderChatMessages(s.val()); });

    function saveUsers() { db.ref('users').set(userAccounts); }
    function saveCourses() { db.ref('bigCoursesData').set(bigCoursesData); }

    // LOGIN & USER SYSTEM
    function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value.trim();
      const dev = document.getElementById('deviceSelect').value;

      const user = userAccounts.find(acc => acc.username === u && acc.password === p);
      if (!user) { alert('Tài khoản hoặc mật khẩu không chính xác!'); return; }
      if (user.isLocked) { alert('⛔ Tài khoản bị khóa do đăng nhập vượt quá số máy!'); return; }

      if (user.role !== 'admin') {
        if (!user.devices) user.devices = [];
        if (!user.devices.includes(dev)) {
          if (user.devices.length >= 2) {
            user.isLocked = true; saveUsers(); alert('Tài khoản bị khóa do vượt giới hạn 2 máy!'); return;
          } else { user.devices.push(dev); saveUsers(); }
        }
      }

      currentUser = user;
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('appScreen').style.display = 'block';
      document.getElementById('userAvatarBtn').innerText = user.name.charAt(0);

      if (user.role === 'admin') {
        document.getElementById('adminTabNav').style.display = 'flex';
        document.getElementById('adminGlobalControls').style.display = 'flex';
        renderAdminUsers();
      }

      renderCoursesGrid();
    }

    function handleLogout() { location.reload(); }

    function switchNavTab(tab) {
      document.querySelectorAll('.nav-tab-item').forEach(i => i.classList.remove('active'));
      document.getElementById('coursesSection').style.display = 'none';
      document.getElementById('subCourseSection').style.display = 'none';
      document.getElementById('lessonStudySection').style.display = 'none';
      document.getElementById('adminSection').style.display = 'none';

      if (tab === 'courses') {
        document.getElementById('coursesSection').style.display = 'block';
      } else if (tab === 'admin') {
        document.getElementById('adminSection').style.display = 'block';
      }
      event.currentTarget.classList.add('active');
    }

    function openScheduleModal() {
      if (scheduleSheetUrl) {
        window.open(scheduleSheetUrl, '_blank');
      } else {
        alert('Chưa cấu hình thời khóa biểu Google Sheet!');
      }
    }

    // RENDER HÌNH 1: GRID KHÓA HỌC LỚN
    function renderCoursesGrid() {
      const container = document.getElementById('coursesGridContainer');
      container.innerHTML = '';

      bigCoursesData.forEach((bc, idx) => {
        const isUnlocked = currentUser.role === 'admin' || (currentUser.unlockedBigCourses && currentUser.unlockedBigCourses.includes(bc.bigCourseId));

        container.innerHTML += `
          <div class="course-card" onclick="selectBigCourse(${idx})">
            <div class="course-thumb" style="background-image: url('${bc.coverImg || ''}')"></div>
            <div class="course-card-body">
              <div class="course-card-title">${bc.bigCourseTitle}</div>
              <div class="course-progress">Đã hoàn thành 0 bài học ${!isUnlocked ? '(Khóa)' : ''}</div>
              <div class="progress-bar"><div class="progress-fill"></div></div>
              <div class="course-card-footer">
                <span class="badge-date">Phát hành: ${bc.releaseDate || 'Đang cập nhật'}</span>
                <span class="price-tag">${bc.price || 'Miễn phí'}</span>
              </div>
            </div>
          </div>
        `;
      });
    }

    // RENDER KHÓA HỌC NHỎ & BÀI HỌC
    function selectBigCourse(idx) {
      const bc = bigCoursesData[idx];
      const isUnlocked = currentUser.role === 'admin' || (currentUser.unlockedBigCourses && currentUser.unlockedBigCourses.includes(bc.bigCourseId));

      if (!isUnlocked) {
        alert('🔒 Khóa học lớn này chưa được kích hoạt! Vui lòng nhập mã kích hoạt.');
        return;
      }

      currentBigCourseIndex = idx;
      document.getElementById('coursesSection').style.display = 'none';
      document.getElementById('subCourseSection').style.display = 'block';
      document.getElementById('currentBigCourseTitle').innerText = bc.bigCourseTitle;

      const container = document.getElementById('subCoursesContainer');
      container.innerHTML = '';

      if (!bc.subCourses || bc.subCourses.length === 0) {
        container.innerHTML = '<div>Chưa có khóa học nhỏ nào.</div>';
        return;
      }

      bc.subCourses.forEach((sub, sIdx) => {
        let lessonsHTML = '';
        if (sub.lessons && sub.lessons.length > 0) {
          sub.lessons.forEach((les, lIdx) => {
            lessonsHTML += `
              <div class="lesson-row" onclick="openLessonStudy(${sIdx}, ${lIdx})">
                <span>▶️ ${les.title}</span>
                <span style="font-size: 0.8rem; color: var(--text-muted);">${les.docs ? les.docs.length : 0} tài liệu</span>
              </div>
            `;
          });
        }

        container.innerHTML += `
          <div class="subcourse-item">
            <div class="subcourse-header" onclick="toggleElement('sub_les_${sIdx}')">
              <span>📖 ${sub.courseTitle}</span>
              <span>▼</span>
            </div>
            <div class="lesson-list" id="sub_les_${sIdx}">
              ${lessonsHTML || '<div style="font-size:0.85rem; color:var(--text-muted);">Chưa có bài học</div>'}
            </div>
          </div>
        `;
      });
    }

    function backToBigCourses() {
      document.getElementById('subCourseSection').style.display = 'none';
      document.getElementById('coursesSection').style.display = 'block';
    }

    function backToSubCourses() {
      document.getElementById('lessonStudySection').style.display = 'none';
      document.getElementById('subCourseSection').style.display = 'block';
    }

    // RENDER HÌNH 2: MÀN HÌNH HỌC 2 CỘT
    function openLessonStudy(subIdx, lesIdx) {
      const lesson = bigCoursesData[currentBigCourseIndex].subCourses[subIdx].lessons[lesIdx];
      document.getElementById('subCourseSection').style.display = 'none';
      document.getElementById('lessonStudySection').style.display = 'block';
      document.getElementById('currentLessonTitle').innerText = lesson.title;

      // Cấu hình video YouTube ẩn các nút ngoài nhưng giữ bộ điều khiển
      const wrapper = document.getElementById('mediaContainerWrapper');
      wrapper.innerHTML = '';
      const ytId = extractYouTubeId(lesson.videoUrl);

      if (ytId) {
        wrapper.innerHTML = `
          <div id="ytPlayerDiv"></div>
          <div class="yt-blocker-top"></div>
          <div class="yt-blocker-bottom-right"></div>
        `;
        ytPlayerInstance = new YT.Player('ytPlayerDiv', {
          videoId: ytId,
          playerVars: { 'autoplay': 1, 'controls': 1, 'modestbranding': 1, 'rel': 0, 'showinfo': 0, 'fs': 1 }
        });
      }

      // Render danh sách nhiều tài liệu đính kèm
      const docsContainer = document.getElementById('lessonDocsList');
      docsContainer.innerHTML = '';
      if (lesson.docs && lesson.docs.length > 0) {
        lesson.docs.forEach((d, dIdx) => {
          docsContainer.innerHTML += `
            <div class="doc-item-link" onclick="loadPdfToViewer('${d.url}')">
              <span>📌 ${d.name}</span>
              <span>Xem file ➔</span>
            </div>
          `;
        });
        // Tự động load file đầu tiên
        loadPdfToViewer(lesson.docs[0].url);
      } else {
        docsContainer.innerHTML = '<div style="font-size:0.85rem; color:var(--text-muted); margin-top:6px;">Không có tài liệu đính kèm.</div>';
      }
    }

    function loadPdfToViewer(url) {
      let embedUrl = url;
      if (embedUrl.includes('drive.google.com') || embedUrl.includes('docs.google.com')) {
        embedUrl = embedUrl.replace(/\/edit(\?.*)?$/, '/preview').replace(/\/view(\?.*)?$/, '/preview');
      }
      document.getElementById('pdfIframe').src = embedUrl;
    }

    function extractYouTubeId(url) {
      if (!url) return null;
      const match = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|shorts\/|watch\?v=|\&v=)([^#\&\?]*).*/);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    function toggleElement(id) {
      const el = document.getElementById(id);
      if (el) el.classList.toggle('open');
    }

    // KÍCH HOẠT MÃ & CHAT
    function activateCourseCode() {
      const code = document.getElementById('activationCodeInput').value.trim();
      const found = activationCodes.find(c => c.code === code);
      if (!found) { alert('Mã kích hoạt không hợp lệ!'); return; }

      if (!currentUser.unlockedBigCourses) currentUser.unlockedBigCourses = [];
      if (!currentUser.unlockedBigCourses.includes(found.bigCourseId)) {
        currentUser.unlockedBigCourses.push(found.bigCourseId);
        saveUsers();
        alert('🎉 Kích hoạt khóa học thành công!');
        renderCoursesGrid();
      }
    }

    function sendChatMessage() {
      const input = document.getElementById('chatMessageInput');
      if (!input.value.trim()) return;
      db.ref('chatMessages').push({
        name: currentUser.name, text: input.value.trim(),
        time: new Date().toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit'})
      });
      input.value = '';
    }

    function handleChatKeyPress(e) { if (e.key === 'Enter') sendChatMessage(); }

    function renderChatMessages(data) {
      const box = document.getElementById('chatMessagesBox');
      if (!box) return;
      box.innerHTML = '';
      if (data) {
        Object.values(data).forEach(m => {
          box.innerHTML += `<div><b>${m.name}:</b> ${m.text} <span style="font-size:0.7rem; color:var(--text-muted);">${m.time}</span></div>`;
        });
        box.scrollTop = box.scrollHeight;
      }
    }

    // ADMIN FUNCTIONS
    function renderAdminUsers() {
      const tbody = document.getElementById('adminUsersTable');
      if (!tbody) return;
      tbody.innerHTML = '';
      userAccounts.forEach(u => {
        tbody.innerHTML += `
          <tr>
            <td>${u.name}</td>
            <td><code>${u.username}</code></td>
            <td>${u.devices ? u.devices.join(', ') : 'Chưa có'}</td>
            <td>${u.isLocked ? 'Khóa' : 'Hoạt động'}</td>
            <td><button class="admin-btn-sm admin-btn-danger" onclick="adminDeleteUser(${u.id})">Xóa</button></td>
          </tr>
        `;
      });
    }

    function adminCreateUser() {
      const name = prompt('Tên học viên:');
      const username = prompt('Tài khoản:');
      const password = prompt('Mật khẩu:');
      if (name && username && password) {
        userAccounts.push({ id: Date.now(), name, username, password, role: 'user', devices: [], isLocked: false, unlockedBigCourses: [] });
        saveUsers(); renderAdminUsers();
      }
    }

    function adminCreateActivationCode() {
      const code = 'VACT-' + Math.random().toString(36).substring(2, 8).toUpperCase();
      activationCodes.push({ code, bigCourseId: 'VACT_BIG_999' });
      db.ref('activationCodes').set(activationCodes);
      alert('Tạo mã kích hoạt thành công: ' + code);
    }

    function adminAddBigCourse() {
      const title = prompt('Tên khóa học lớn:');
      if (title) {
        bigCoursesData.push({ bigCourseId: 'BIG_' + Date.now(), bigCourseTitle: title, subCourses: [] });
        saveCourses(); renderCoursesGrid();
      }
    }

    function resetCoursesToDefault() {
      if (confirm('Reset toàn bộ dữ liệu khóa học?')) {
        bigCoursesData = defaultBigCoursesData;
        saveCourses(); renderCoursesGrid();
      }
    }
  </script>
</body>
</html>
