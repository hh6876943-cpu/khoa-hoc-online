<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HỆ THỐNG KHÓA HỌC TRỰC TUYẾN</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- FIREBASE SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <!-- YOUTUBE IFRAME API SDK -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <style>
    :root {
      --bg-dark: #12141e;
      --bg-card: #1d2130;
      --bg-hover: #262c3e;
      --primary: #00cec9;
      --primary-accent: #6c5ce7;
      --pink-tag: #e84393;
      --teal-tag: #00cec9;
      --text-main: #f5f6fa;
      --text-muted: #8c93a8;
      --border: rgba(255, 255, 255, 0.08);
      --font-family: 'Inter', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-family); background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; overflow-x: hidden; }

    /* MÀN HÌNH ĐĂNG NHẬP */
    #loginScreen {
      display: flex; justify-content: center; align-items: center; min-height: 100vh;
      background: radial-gradient(circle at center, #1d2130 0%, #12141e 100%);
    }
    .login-card {
      background: var(--bg-card); border: 1px solid var(--border);
      padding: 40px; border-radius: 20px; width: 100%; max-width: 420px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .login-card h2 { text-align: center; color: var(--primary); margin-bottom: 24px; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: var(--text-muted); }
    .form-group input {
      width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--bg-dark); color: #fff; outline: none; font-family: var(--font-family);
    }
    .btn-submit {
      width: 100%; padding: 12px; background: var(--primary-accent); color: #fff; border: none;
      border-radius: 10px; font-weight: 600; cursor: pointer; font-family: var(--font-family); transition: 0.2s;
    }

    /* THANH NAVIGATION PHÍA TRÊN (TOP BAR - GIỐNG HÌNH 1) */
    .top-navbar {
      height: 70px; background-color: var(--bg-card); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; padding: 0 32px; sticky: top; top: 0; z-index: 100;
    }
    .nav-tabs { display: flex; gap: 28px; align-items: center; }
    .nav-item {
      display: flex; align-items: center; gap: 8px; font-size: 0.95rem; font-weight: 500;
      color: var(--text-muted); cursor: pointer; padding: 10px 0; border-bottom: 3px solid transparent; transition: 0.2s;
    }
    .nav-item:hover, .nav-item.active { color: #fff; border-bottom-color: var(--primary); }
    .top-right-actions { display: flex; align-items: center; gap: 18px; }
    .search-bar {
      background: var(--bg-dark); border: 1px solid var(--border); border-radius: 20px;
      padding: 8px 16px; color: #fff; display: flex; align-items: center; gap: 8px; font-size: 0.85rem;
    }
    .search-bar input { background: transparent; border: none; color: #fff; outline: none; }
    .user-avatar {
      width: 38px; height: 38px; border-radius: 50%; background: var(--primary);
      color: #000; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer;
    }

    /* KHU VỰC NỘI DUNG CHÍNH */
    .container { max-width: 1400px; margin: 0 auto; padding: 24px; }
    
    /* GIAO DIỆN KHÓA HỌC DẠNG CARD (HÌNH 1) */
    .courses-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 24px; margin-top: 20px;
    }
    .course-card {
      background: var(--bg-card); border-radius: 16px; border: 1px solid var(--border);
      overflow: hidden; cursor: pointer; transition: transform 0.2s, border-color 0.2s; display: flex; flex-direction: column;
    }
    .course-card:hover { transform: translateY(-4px); border-color: var(--primary); }
    .course-thumb { width: 100%; height: 200px; object-fit: cover; background: #2a2e3d; }
    .course-info { padding: 18px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
    .course-title { font-size: 1.1rem; font-weight: 700; color: #fff; margin-bottom: 12px; line-height: 1.4; }
    .course-progress-text { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; }
    .progress-bar-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; margin-bottom: 16px; }
    .progress-bar-fill { height: 100%; background: var(--primary); width: 0%; }
    .course-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px dashed var(--border); padding-top: 12px; }
    .tag-badge { padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
    .tag-live { background: rgba(232, 67, 147, 0.2); color: var(--pink-tag); }
    .tag-video { background: rgba(0, 206, 201, 0.2); color: var(--teal-tag); }
    .course-price { font-weight: 700; color: #74b9ff; font-size: 1.1rem; }

    /* NÚT QUAY LẠI */
    .back-btn {
      display: inline-flex; align-items: center; gap: 8px; color: var(--primary); cursor: pointer;
      font-weight: 600; margin-bottom: 20px; background: var(--bg-card); padding: 8px 16px; border-radius: 10px; border: 1px solid var(--border);
    }
    .back-btn:hover { background: var(--bg-hover); }

    /* GIAO DIỆN KHÓA HỌC NHỎ & BÀI HỌC */
    .sub-course-box {
      background: var(--bg-card); border-radius: 14px; border: 1px solid var(--border); margin-bottom: 16px; padding: 20px;
    }
    .sub-course-title { font-size: 1.2rem; font-weight: 700; color: var(--primary); margin-bottom: 14px; }
    .lesson-row {
      padding: 12px 16px; background: var(--bg-dark); border-radius: 10px; border: 1px solid var(--border);
      margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s;
    }
    .lesson-row:hover { background: var(--bg-hover); border-color: var(--primary); }

    /* GIAO DIỆN PHÒNG HỌC 2 CỘT (HÌNH 2) */
    .classroom-layout {
      display: grid; grid-template-columns: 1fr 1fr; gap: 20px; height: calc(100vh - 120px);
    }
    @media (max-width: 1024px) {
      .classroom-layout { grid-template-columns: 1fr; height: auto; }
    }

    /* CỘT TRÁI: VIDEO & NỘI DUNG */
    .left-panel { display: flex; flex-direction: column; gap: 16px; overflow-y: auto; padding-right: 6px; }
    .media-player-wrapper {
      position: relative; width: 100%; padding-top: 56.25%; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid var(--border);
    }
    .media-player-wrapper iframe, .media-player-wrapper div#ytPlayerDiv {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;
    }
    
    /* LỚP PHỦ CHE TIÊU ĐỀ/CHẶN CHUYỂN HƯỚNG YOUTUBE */
    .yt-blocker-top { position: absolute; top: 0; left: 0; width: 100%; height: 60px; z-index: 10; background: transparent; }
    .yt-blocker-bottom-right { position: absolute; bottom: 35px; right: 0; width: 110px; height: 50px; z-index: 10; background: transparent; }
    .yt-blocker-bottom-left { position: absolute; bottom: 35px; left: 0; width: 200px; height: 50px; z-index: 10; background: transparent; }

    /* DANH SÁCH NHIỀU TÀI LIỆU ĐÍNH KÈM BÊN DƯỚI VIDEO (HÌNH 2) */
    .attachments-card {
      background: var(--bg-card); border-radius: 12px; padding: 18px; border: 1px solid var(--border);
    }
    .attachments-title { font-size: 0.95rem; font-weight: 700; color: var(--text-muted); margin-bottom: 12px; }
    .doc-link-item {
      display: flex; justify-content: space-between; align-items: center; padding: 10px 14px;
      background: var(--bg-dark); border-radius: 8px; border: 1px solid var(--border); margin-bottom: 8px;
      color: #74b9ff; font-size: 0.9rem; text-decoration: none; cursor: pointer; transition: 0.2s;
    }
    .doc-link-item:hover { background: var(--bg-hover); color: var(--primary); }

    /* CỘT PHẢI: XEM TÀI LIỆU TRỰC TIẾP & CHAT */
    .right-panel { display: flex; flex-direction: column; gap: 12px; height: 100%; }
    .document-viewer-box {
      flex-grow: 1; background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; position: relative; min-height: 400px;
    }
    .document-viewer-box iframe { width: 100%; height: 100%; border: none; }

    .chat-box {
      height: 220px; background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .chat-header { padding: 10px 16px; background: rgba(0,0,0,0.2); font-size: 0.85rem; font-weight: 700; color: var(--text-muted); }
    .chat-messages { flex-grow: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; font-size: 0.85rem; }
    .chat-input-row { display: flex; padding: 10px; background: var(--bg-dark); gap: 8px; }
    .chat-input-row input { flex-grow: 1; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; color: #fff; outline: none; }
    .btn-send { background: var(--primary-accent); color: #fff; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; }

    /* LỊCH ĐÀO TẠO GOOGLE SHEET FULLSCREEN */
    .schedule-frame-wrapper {
      width: 100%; height: calc(100vh - 120px); background: var(--bg-card); border-radius: 16px; overflow: hidden; border: 1px solid var(--border);
    }
    .schedule-frame-wrapper iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <!-- MÀN HÌNH ĐĂNG NHẬP -->
  <div id="loginScreen">
    <div class="login-card">
      <h2>🎓 HỆ THỐNG HỌC TẬP</h2>
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Tài khoản</label>
          <input type="text" id="username" placeholder="admin hoặc user" required>
        </div>
        <div class="form-group">
          <label>Mật khẩu</label>
          <input type="password" id="password" placeholder="Mật khẩu" required>
        </div>
        <button type="submit" class="btn-submit">Đăng Nhập Ngay</button>
      </form>
    </div>
  </div>

  <!-- BẢNG ĐIỀU KHIỂN CHÍNH -->
  <div id="appScreen" style="display: none;">
    <!-- TOP NAVBAR GIỐNG HÌNH 1 -->
    <div class="top-navbar">
      <div class="nav-tabs">
        <div class="nav-item active" id="tabCourses" onclick="switchNavTab('courses')">🎓 Khóa học</div>
        <div class="nav-item" id="tabSchedule" onclick="switchNavTab('schedule')">📅 Lịch đào tạo</div>
        <div class="nav-item" id="tabDocs" onclick="switchNavTab('docs')">📚 Tài liệu</div>
        <div class="nav-item" id="tabGrade" onclick="switchNavTab('grade')">🔍 Tra cứu học bạ</div>
      </div>

      <div class="top-right-actions">
        <div class="search-bar">
          <span>🔍</span>
          <input type="text" placeholder="Tìm kiếm khóa học...">
        </div>
        <div class="user-avatar" id="userAvatarBtn" onclick="handleLogout()" title="Bấm để đăng xuất">H</div>
      </div>
    </div>

    <div class="container">
      
      <!-- VIEW 1: TRANG LỊCH ĐÀO TẠO (NHÚNG GOOGLE SHEET) -->
      <div id="scheduleView" style="display: none;">
        <div class="schedule-frame-wrapper">
          <iframe src="https://docs.google.com/spreadsheets/d/1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgvE2upms/preview"></iframe>
        </div>
      </div>

      <!-- VIEW 2: DANH SÁCH KHÓA HỌC LỚN (HÌNH 1) -->
      <div id="bigCoursesView">
        <h2 style="margin-bottom: 20px;">Khóa Học CỦA TÔI</h2>
        <div class="courses-grid" id="bigCoursesGrid">
          <!-- Render danh sách khóa học bằng JS -->
        </div>
      </div>

      <!-- VIEW 3: DANH SÁCH KHÓA HỌC NHỎ & PHẦN BÀI HỌC -->
      <div id="subCoursesView" style="display: none;">
        <div class="back-btn" onclick="showBigCoursesView()">◀ Quay lại Khóa học của tôi</div>
        <h2 id="selectedBigCourseTitle" style="margin-bottom: 20px; color: var(--primary);">Tên Khóa Học Lớn</h2>
        <div id="subCoursesListContainer">
          <!-- Render bằng JS -->
        </div>
      </div>

      <!-- VIEW 4: PHÒNG HỌC TỔNG HỢP 2 CỘT (HÌNH 2) -->
      <div id="classroomView" style="display: none;">
        <div class="back-btn" onclick="showSubCoursesView()">◀ Quay lại danh sách bài học</div>
        
        <div class="classroom-layout">
          <!-- CỘT TRÁI: VIDEO + TẢI NHIỀU TÀI LIỆU ĐÍNH KÈM -->
          <div class="left-panel">
            <h3 id="classroomLessonTitle" style="color: #fff;">Tên Bài Học</h3>
            
            <div class="media-player-wrapper" id="videoPlayerContainer">
              <div id="ytPlayerDiv"></div>
              <!-- CHE CÁC NÚT CHUYỂN HƯỚNG VÀ CHẶN CLICK SANG YOUTUBE -->
              <div class="yt-blocker-top"></div>
              <div class="yt-blocker-bottom-right"></div>
              <div class="yt-blocker-bottom-left"></div>
            </div>

            <!-- DANH SÁCH NHIỀU TÀI LIỆU ĐÍNH KÈM BÊN DƯỚI VIDEO (HÌNH 2) -->
            <div class="attachments-card">
              <div class="attachments-title">TÀI LIỆU ĐÍNH KÈM BUỔI HỌC</div>
              <div id="docAttachmentsList">
                <!-- Render các link tài liệu bằng JS -->
              </div>
            </div>
          </div>

          <!-- CỘT PHẢI: TRÌNH XEM TÀI LIỆU ĐỘC QUYỀN + KHUNG CHAT -->
          <div class="right-panel">
            <div class="document-viewer-box">
              <iframe id="docViewerIframe" src="about:blank"></iframe>
            </div>

            <div class="chat-box">
              <div class="chat-header">💬 Thảo luận & Giải đáp câu hỏi</div>
              <div class="chat-messages" id="chatBoxMessages">
                <div><b>Hệ thống:</b> Chào mừng bạn đến với buổi học!</div>
              </div>
              <div class="chat-input-row">
                <input type="text" id="chatInputText" placeholder="Viết bình luận..." onkeypress="handleChatEnter(event)">
                <button class="btn-send" onclick="sendChatMessage()">Gửi</button>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    // CẤU HÌNH FIREBASE REALTIME DATABASE
    const firebaseConfig = {
      apiKey: "AIzaSyCdC9u4XFa0UgM09dtn-OCPFf8EIFPXZUQ",
      authDomain: "khoa-hoc-online-f936d.firebaseapp.com",
      databaseURL: "https://khoa-hoc-online-f936d-default-rtdb.firebaseio.com",
      projectId: "khoa-hoc-online-f936d",
      storageBucket: "khoa-hoc-online-f936d.firebasestorage.app",
      messagingSenderId: "115353900067",
      appId: "1:115353900067:web:7e2ece09223a40e3108d96"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // DỮ LIỆU CẤU TRÚC MẶC ĐỊNH SÁNG TẠO THEO MẪU HÌNH 1 VÀ 2
    const defaultBigCourses = [
      {
        id: 'big1',
        title: 'STEP 5 2027 | Killingcamp',
        thumb: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600&auto=format&fit=crop',
        progress: '0/0 bài',
        date: 'Phát hành: 24/05/2027',
        price: '800.000 VND',
        subCourses: [
          {
            subTitle: 'Khóa 1: Ôn Tập Kiến Thức Nền Tảng',
            lessons: [
              {
                title: 'Buổi 1: Đạo Hàm & Biến Thiên Hàm Số',
                videoUrl: 'https://www.youtube.com/watch?v=dQw4w9WgXcQ',
                mainDocUrl: 'https://docs.google.com/document/d/1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgvE2upms/preview',
                attachments: [
                  { name: '[Tài liệu] Theme 7.pdf', url: 'https://docs.google.com/document/d/1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgvE2upms/preview' },
                  { name: '[Ghi chép] Theme 7.pdf', url: 'https://docs.google.com/document/d/1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgvE2upms/preview' },
                  { name: '[Handout] VD Theme 7.pdf', url: 'https://docs.google.com/document/d/1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgvE2upms/preview' }
                ]
              }
            ]
          }
        ]
      },
      {
        id: 'big2',
        title: 'PHỤ ĐẠO THÊM | Ôn thi giữa kì, Cuối kì, Chữa đề trường sở 2026 – 2027',
        thumb: 'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=600&auto=format&fit=crop',
        progress: '0/1 bài',
        date: 'Chữa đề liên tục',
        price: '500.000 VND',
        subCourses: []
      },
      {
        id: 'big3',
        title: 'Nhập môn Hàm số – HHKG – Tổ hợp – Xác suất – Đạo hàm – Tiền đề Toán 12',
        thumb: 'https://images.unsplash.com/photo-1509228468518-180dd4864904?w=600&auto=format&fit=crop',
        progress: '0/39 bài',
        date: 'Phát hành: 12/04/2026',
        price: '500.000 VND',
        subCourses: []
      }
    ];

    let currentUser = null;
    let selectedBigCourseObj = null;
    let ytPlayerInstance = null;

    // ĐĂNG NHẬP
    function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value.trim();

      if ((u === 'admin' && p === 'hhh@123456') || (u === 'user' && p === 'user123')) {
        currentUser = { username: u, name: u === 'admin' ? 'Admin Tối Cao' : 'Học Viên VIP' };
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('appScreen').style.display = 'block';
        document.getElementById('userAvatarBtn').innerText = u.charAt(0).toUpperCase();
        renderBigCourses();
      } else {
        alert('Tài khoản hoặc mật khẩu không chính xác!');
      }
    }

    function handleLogout() { location.reload(); }

    // ĐIỀU HƯỚNG TAB TRÊN NAVBAR
    function switchNavTab(tab) {
      document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
      document.getElementById('scheduleView').style.display = 'none';
      document.getElementById('bigCoursesView').style.display = 'none';
      document.getElementById('subCoursesView').style.display = 'none';
      document.getElementById('classroomView').style.display = 'none';

      if (tab === 'schedule') {
        document.getElementById('tabSchedule').classList.add('active');
        document.getElementById('scheduleView').style.display = 'block';
      } else if (tab === 'courses') {
        document.getElementById('tabCourses').classList.add('active');
        showBigCoursesView();
      } else {
        document.getElementById('tabCourses').classList.add('active');
        showBigCoursesView();
      }
    }

    // HIỂN THỊ DANH SÁCH KHÓA HỌC LỚN (HÌNH 1)
    function renderBigCourses() {
      const grid = document.getElementById('bigCoursesGrid');
      grid.innerHTML = '';

      defaultBigCourses.forEach(course => {
        grid.innerHTML += `
          <div class="course-card" onclick="openSubCoursesView('${course.id}')">
            <img src="${course.thumb}" class="course-thumb" alt="thumb">
            <div class="course-info">
              <div class="course-title">${course.title}</div>
              <div>
                <div class="course-progress-text">Đã hoàn thành ${course.progress}</div>
                <div class="progress-bar-bg"><div class="progress-bar-fill"></div></div>
                <div class="course-footer">
                  <div>
                    <span class="tag-badge tag-live">((•)) Livestream</span>
                    <span class="tag-badge tag-video">▶ Video</span>
                  </div>
                  <div class="course-price">${course.price}</div>
                </div>
              </div>
            </div>
          </div>
        `;
      });
    }

    function showBigCoursesView() {
      document.getElementById('bigCoursesView').style.display = 'block';
      document.getElementById('subCoursesView').style.display = 'none';
      document.getElementById('classroomView').style.display = 'none';
    }

    // MỞ KHÓA HỌC NHỎ
    function openSubCoursesView(courseId) {
      selectedBigCourseObj = defaultBigCourses.find(c => c.id === courseId);
      if (!selectedBigCourseObj) return;

      document.getElementById('selectedBigCourseTitle').innerText = selectedBigCourseObj.title;
      const container = document.getElementById('subCoursesListContainer');
      container.innerHTML = '';

      if (!selectedBigCourseObj.subCourses || selectedBigCourseObj.subCourses.length === 0) {
        container.innerHTML = '<div style="color:var(--text-muted);">Khóa học này đang cập nhật bài giảng...</div>';
      } else {
        selectedBigCourseObj.subCourses.forEach(sub => {
          let lessonsHtml = '';
          sub.lessons.forEach(les => {
            lessonsHtml += `
              <div class="lesson-row" onclick="openClassroom('${les.title}', '${les.videoUrl}', '${les.mainDocUrl}', ${JSON.stringify(les.attachments).replace(/"/g, '&quot;')})">
                <span>▶ ${les.title}</span>
                <span style="color: var(--primary); font-size: 0.85rem;">Vào Học ➔</span>
              </div>
            `;
          });

          container.innerHTML += `
            <div class="sub-course-box">
              <div class="sub-course-title">${sub.subTitle}</div>
              ${lessonsHtml}
            </div>
          `;
        });
      }

      document.getElementById('bigCoursesView').style.display = 'none';
      document.getElementById('subCoursesView').style.display = 'block';
    }

    function showSubCoursesView() {
      document.getElementById('subCoursesView').style.display = 'block';
      document.getElementById('classroomView').style.display = 'none';
    }

    // TRÍCH XUẤT YOUTUBE ID
    function extractYouTubeId(url) {
      if (!url) return null;
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|shorts\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    // PHÒNG HỌC CHIA 2 CỘT TỔNG HỢP (HÌNH 2)
    function openClassroom(title, videoUrl, mainDocUrl, attachments) {
      document.getElementById('classroomLessonTitle').innerText = title;

      // Xử lý Trình phát Video YouTube Bảo Mật
      const ytId = extractYouTubeId(videoUrl);
      const container = document.getElementById('videoPlayerContainer');
      
      if (ytPlayerInstance && typeof ytPlayerInstance.destroy === 'function') {
        try { ytPlayerInstance.destroy(); } catch(e) {}
      }

      container.innerHTML = `
        <div id="ytPlayerDiv"></div>
        <div class="yt-blocker-top"></div>
        <div class="yt-blocker-bottom-right"></div>
        <div class="yt-blocker-bottom-left"></div>
      `;

      if (ytId) {
        ytPlayerInstance = new YT.Player('ytPlayerDiv', {
          videoId: ytId,
          playerVars: {
            'autoplay': 1, 'controls': 1, 'modestbranding': 1, 'rel': 0, 'showinfo': 0, 'fs': 1, 'origin': window.location.origin
          }
        });
      }

      // Xử lý Danh Sách Nhiều Tài Liệu Đính Kèm (Hình 2)
      const docContainer = document.getElementById('docAttachmentsList');
      docContainer.innerHTML = '';
      if (attachments && attachments.length > 0) {
        attachments.forEach(doc => {
          docContainer.innerHTML += `
            <a class="doc-link-item" onclick="loadMainDoc('${doc.url}')">
              <span>📥 ${doc.name}</span>
              <span>💾 Tải về / Xem</span>
            </a>
          `;
        });
      } else {
        docContainer.innerHTML = '<div style="color:var(--text-muted); font-size:0.85rem;">Không có file đính kèm</div>';
      }

      // Load Document lên Cột Phải
      loadMainDoc(mainDocUrl);

      document.getElementById('subCoursesView').style.display = 'none';
      document.getElementById('classroomView').style.display = 'block';
    }

    function loadMainDoc(url) {
      let finalUrl = url;
      if (finalUrl.includes('docs.google.com') || finalUrl.includes('drive.google.com')) {
        finalUrl = finalUrl.replace(/\/edit.*$/, '/preview').replace(/\/view.*$/, '/preview');
      }
      document.getElementById('docViewerIframe').src = finalUrl;
    }

    // CHAT
    function sendChatMessage() {
      const input = document.getElementById('chatInputText');
      const text = input.value.trim();
      if (!text) return;

      const box = document.getElementById('chatBoxMessages');
      box.innerHTML += `<div><b>${currentUser.name}:</b> ${text}</div>`;
      box.scrollTop = box.scrollHeight;
      input.value = '';
    }

    function handleChatEnter(e) { if (e.key === 'Enter') sendChatMessage(); }
  </script>
</body>
</html>
