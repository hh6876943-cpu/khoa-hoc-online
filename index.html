<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Giáo Dục EMPIRE TEAM - Học Trực Tuyến</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .overlay-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            backdrop-filter: blur(4px);
            transition: background 0.2s;
            text-decoration: none;
        }
        .overlay-btn:hover {
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
        }
    </style>
</head>
<body class="bg-slate-100 font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-cyan-600 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="goHome()">
                <div class="bg-white text-cyan-600 p-2 rounded-lg font-bold shadow">
                    <i class="fa-solid fa-graduation-cap text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">HỆ THỐNG GIÁO DỤC EMPIRE TEAM</h1>
                    <span class="text-xs text-cyan-100">Nền tảng học tập & Luyện thi chất lượng cao</span>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <button id="adminToggleBtn" onclick="toggleAdminMode()" class="bg-cyan-700 hover:bg-cyan-800 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2 shadow-sm">
                    <i class="fa-solid fa-lock" id="adminIcon"></i> <span id="adminText">Chế độ Admin</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6">
        <!-- Breadcrumb / Navigation bar -->
        <nav id="breadcrumb" class="text-sm text-slate-600 mb-6 flex items-center space-x-2 bg-white p-3 rounded-lg shadow-sm">
            <span class="cursor-pointer hover:text-cyan-600 font-medium" onclick="goHome()"><i class="fa-solid fa-house"></i> Trang chủ</span>
        </nav>

        <!-- Dynamic Content Area -->
        <div id="appContent"></div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-800 text-slate-400 py-6 mt-12">
        <div class="max-w-7xl mx-auto px-4 text-center text-sm">
            <p>&copy; 2026 EMPIRE TEAM Education System. All rights reserved.</p>
        </div>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // Dữ liệu mẫu khởi tạo ban đầu (Có lưu trữ trong localStorage)
        const defaultData = [
            {
                id: "khoa-1",
                name: "Khóa Luyện Thi TN THPT Môn Tiếng Anh",
                desc: "Hệ thống trọn gói kiến thức từ cơ bản đến nâng cao, luyện đề thực chiến.",
                image: "https://images.unsplash.com/photo-1546410531-bb4caa6b424d?auto=format&fit=crop&w=600&q=80",
                scheduleLink: "https://docs.google.com/spreadsheets/d/example", // Link GG Drive/Sheet/Docs thời khóa biểu
                subCourses: [
                    {
                        id: "sub-1-1",
                        name: "Ngữ Pháp Nền Tảng Từ A-Z",
                        sections: [
                            {
                                id: "sec-1-1-1",
                                name: "Chủ đề 1: Sự hòa hợp giữa chủ ngữ và động từ",
                                videos: [
                                    { id: "v-1", title: "Bài giảng 1: Lý thuyết cơ bản", url: "https://www.youtube.com/embed/dQw4w9WgXcQ", docUrl: "https://drive.google.com/file/d/example1/view" },
                                    { id: "v-2", title: "Bài giảng 2: Các trường hợp đặc biệt & Bài tập củng cố", url: "https://www.youtube.com/embed/dQw4w9WgXcQ", docUrl: "https://drive.google.com/file/d/example2/view" }
                                ]
                            }
                        ]
                    }
                ]
            },
            {
                id: "khoa-2",
                name: "Khóa Từ Vựng & Đọc Hiểu Chuyên Sâu",
                desc: "Chinh phục điểm 9+ môn Tiếng Anh với các chiến thuật đọc hiểu đỉnh cao.",
                image: "https://images.unsplash.com/photo-1513258496099-48168024aec0?auto=format&fit=crop&w=600&q=80",
                scheduleLink: "https://docs.google.com/document/d/example",
                subCourses: [
                    {
                        id: "sub-2-1",
                        name: "Chiến Thuật Skimming & Scanning",
                        sections: [
                            {
                                id: "sec-2-1-1",
                                name: "Phần 1: Phương pháp làm bài đọc điền từ",
                                videos: [
                                    { id: "v-3", title: "Bài 1: Tổng quan dạng bài Cloze Test", url: "https://www.youtube.com/embed/dQw4w9WgXcQ", docUrl: "https://drive.google.com/file/d/example3/view" }
                                ]
                            }
                        ]
                    }
                ]
            }
        ];

        // Lấy dữ liệu từ localStorage hoặc dùng mặc định
        let courses = JSON.parse(localStorage.getItem('empire_courses')) || defaultData;
        let isAdmin = localStorage.getItem('empire_isAdmin') === 'true';

        // Trạng thái điều hướng hiện tại
        let currentView = 'home'; // 'home', 'subcourses', 'sections', 'watch'
        let selectedCourseId = null;
        let selectedSubCourseId = null;
        let selectedVideo = null;

        function saveData() {
            localStorage.setItem('empire_courses', JSON.stringify(courses));
        }

        function toggleAdminMode() {
            if (!isAdmin) {
                let pass = prompt("Nhập mật khẩu quản trị viên (mặc định: admin123):");
                if (pass === "admin123") {
                    isAdmin = true;
                } else if (pass !== null) {
                    alert("Sai mật khẩu!");
                    return;
                } else {
                    return;
                }
            } else {
                isAdmin = false;
            }
            localStorage.setItem('empire_isAdmin', isAdmin);
            updateAdminUI();
            render();
        }

        function updateAdminUI() {
            const btn = document.getElementById('adminToggleBtn');
            const icon = document.getElementById('adminIcon');
            const text = document.getElementById('adminText');
            if (isAdmin) {
                btn.className = "bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2 shadow-sm";
                icon.className = "fa-solid fa-unlock";
                text.innerText = "Thoát Admin";
            } else {
                btn.className = "bg-cyan-700 hover:bg-cyan-800 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2 shadow-sm";
                icon.className = "fa-solid fa-lock";
                text.innerText = "Chế độ Admin";
            }
        }

        function goHome() {
            currentView = 'home';
            selectedCourseId = null;
            selectedSubCourseId = null;
            selectedVideo = null;
            render();
        }

        function render() {
            updateAdminUI();
            const container = document.getElementById('appContent');
            const breadcrumb = document.getElementById('breadcrumb');
            
            // Cập nhật Breadcrumb
            let breadcrumbHTML = `<span class="cursor-pointer hover:text-cyan-600 font-medium" onclick="goHome()"><i class="fa-solid fa-house"></i> Trang chủ</span>`;

            if (currentView === 'home') {
                breadcrumb.innerHTML = breadcrumbHTML;
                container.innerHTML = renderHomeView();
            } else if (currentView === 'subcourses') {
                let course = courses.find(c => c.id === selectedCourseId);
                breadcrumbHTML += ` <i class="fa-solid fa-chevron-right text-xs text-slate-400"></i> <span class="text-cyan-600 font-medium">${course ? course.name : ''}</span>`;
                breadcrumb.innerHTML = breadcrumbHTML;
                container.innerHTML = renderSubCoursesView();
            } else if (currentView === 'sections') {
                let course = courses.find(c => c.id === selectedCourseId);
                let sub = course ? course.subCourses.find(s => s.id === selectedSubCourseId) : null;
                breadcrumbHTML += ` <i class="fa-solid fa-chevron-right text-xs text-slate-400"></i> <span class="cursor-pointer hover:text-cyan-600" onclick="selectCourse('${selectedCourseId}')">${course.name}</span>`;
                breadcrumbHTML += ` <i class="fa-solid fa-chevron-right text-xs text-slate-400"></i> <span class="text-cyan-600 font-medium">${sub ? sub.name : ''}</span>`;
                breadcrumb.innerHTML = breadcrumbHTML;
                container.innerHTML = renderSectionsView();
            } else if (currentView === 'watch') {
                let course = courses.find(c => c.id === selectedCourseId);
                let sub = course ? course.subCourses.find(s => s.id === selectedSubCourseId) : null;
                breadcrumbHTML += ` <i class="fa-solid fa-chevron-right text-xs text-slate-400"></i> <span class="cursor-pointer hover:text-cyan-600" onclick="selectCourse('${selectedCourseId}')">${course.name}</span>`;
                breadcrumbHTML += ` <i class="fa-solid fa-chevron-right text-xs text-slate-400"></i> <span class="cursor-pointer hover:text-cyan-600" onclick="selectSubCourse('${selectedSubCourseId}')">${sub.name}</span>`;
                breadcrumbHTML += ` <i class="fa-solid fa-chevron-right text-xs text-slate-400"></i> <span class="text-cyan-600 font-medium">${selectedVideo.title}</span>`;
                breadcrumb.innerHTML = breadcrumbHTML;
                container.innerHTML = renderWatchView();
            }
        }

        // --- 1. GIAO DIỆN TRANG CHỦ (Khóa học lớn) ---
        function renderHomeView() {
            let html = `
                <div class="mb-6 flex justify-between items-center">
                    <div>
                        <h2 class="text-2xl font-bold text-slate-800">Danh Sách Khóa Học Lớn</h2>
                        <p class="text-sm text-slate-500">Chọn khóa học để bắt đầu lộ trình học tập của bạn</p>
                    </div>
            `;
            if (isAdmin) {
                html += `<button onclick="addLargeCourse()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow flex items-center gap-2"><i class="fa-solid fa-plus"></i> Thêm Khóa Học Lớn</button>`;
            }
            html += `</div><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">`;

            courses.forEach(course => {
                html += `
                    <div class="bg-white rounded-xl shadow-sm hover:shadow-md transition overflow-hidden border border-slate-200 flex flex-col">
                        <div class="h-40 overflow-hidden relative cursor-pointer" onclick="selectCourse('${course.id}')">
                            <img src="${course.image}" alt="${course.name}" class="w-full h-full object-cover hover:scale-105 transition duration-300">
                        </div>
                        <div class="p-5 flex-grow flex flex-col justify-between">
                            <div>
                                <h3 class="font-bold text-lg text-slate-800 mb-2 cursor-pointer hover:text-cyan-600" onclick="selectCourse('${course.id}')">${course.name}</h3>
                                <p class="text-slate-600 text-sm mb-4 line-clamp-2">${course.desc}</p>
                            </div>
                            <div class="pt-4 border-t border-slate-100 flex items-center justify-between">
                                <button onclick="selectCourse('${course.id}')" class="bg-cyan-600 hover:bg-cyan-700 text-white text-sm px-4 py-2 rounded-lg font-medium transition w-full text-center">Vào Khóa Học</button>
                            </div>
                `;
                if (isAdmin) {
                    html += `
                        <div class="mt-3 flex gap-2">
                            <button onclick="editLargeCourse('${course.id}')" class="flex-1 bg-amber-50 hover:bg-amber-100 text-amber-700 text-xs py-1.5 rounded font-medium border border-amber-200"><i class="fa-solid fa-pen"></i> Sửa</button>
                            <button onclick="deleteLargeCourse('${course.id}')" class="flex-1 bg-rose-50 hover:bg-rose-100 text-rose-700 text-xs py-1.5 rounded font-medium border border-rose-200"><i class="fa-solid fa-trash"></i> Xóa</button>
                        </div>
                    `;
                }
                html += `</div></div>`;
            });
            html += `</div>`;
            return html;
        }

        function selectCourse(courseId) {
            selectedCourseId = courseId;
            currentView = 'subcourses';
            render();
        }

        // --- 2. GIAO DIỆN KHÓA HỌC NHỎ & THỜI KHÓA BIỂU ---
        function renderSubCoursesView() {
            let course = courses.find(c => c.id === selectedCourseId);
            if (!course) return goHome();

            let html = `
                <div class="bg-gradient-to-r from-cyan-600 to-blue-600 rounded-2xl p-6 text-white mb-8 shadow-md flex flex-col md:flex-row justify-between items-center gap-4">
                    <div>
                        <h2 class="text-2xl font-bold mb-2">${course.name}</h2>
                        <p class="text-cyan-100 text-sm max-w-2xl">${course.desc}</p>
                    </div>
            `;
            // Nút xem Thời khóa biểu (Luôn có trong mỗi khóa học lớn)
            let scheduleUrl = course.scheduleLink || "#";
            html += `
                    <a href="${scheduleUrl}" target="_blank" class="bg-white text-cyan-700 hover:bg-cyan-50 px-5 py-3 rounded-xl font-bold text-sm shadow-sm flex items-center gap-2 transition whitespace-nowrap">
                        <i class="fa-solid fa-calendar-days text-lg"></i> THỜI KHÓA BIỂU
                    </a>
                </div>
            `;

            html += `
                <div class="mb-6 flex justify-between items-center">
                    <div>
                        <h3 class="text-xl font-bold text-slate-800">Danh Mục & Khóa Học Nhỏ</h3>
                        <p class="text-sm text-slate-500">Danh sách các phần học chi tiết trong khóa học này</p>
                    </div>
            `;
            if (isAdmin) {
                html += `
                    <div class="flex gap-2">
                        <button onclick="editScheduleLink('${course.id}')" class="bg-cyan-700 hover:bg-cyan-800 text-white px-3 py-2 rounded-lg text-xs font-medium shadow flex items-center gap-1.5"><i class="fa-solid fa-link"></i> Sửa Link TKB</button>
                        <button onclick="addSubCourse('${course.id}')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow flex items-center gap-2"><i class="fa-solid fa-plus"></i> Thêm Khóa Học Nhỏ</button>
                    </div>
                `;
            }
            html += `</div><div class="grid grid-cols-1 md:grid-cols-2 gap-6">`;

            if (!course.subCourses || course.subCourses.length === 0) {
                html += `<div class="col-span-2 text-center py-10 bg-white rounded-xl border border-slate-200 text-slate-500">Chưa có khóa học nhỏ nào.</div>`;
            } else {
                course.subCourses.forEach(sub => {
                    html += `
                        <div class="bg-white rounded-xl p-5 shadow-sm border border-slate-200 hover:border-cyan-400 transition flex flex-col justify-between">
                            <div>
                                <div class="flex items-center gap-3 mb-3">
                                    <div class="bg-cyan-50 text-cyan-600 p-3 rounded-lg font-bold"><i class="fa-solid fa-book-open"></i></div>
                                    <h4 class="font-bold text-lg text-slate-800 cursor-pointer hover:text-cyan-600" onclick="selectSubCourse('${sub.id}')">${sub.name}</h4>
                                </div>
                                <p class="text-xs text-slate-500 mb-4">${sub.sections ? sub.sections.length : 0} phần bài giảng / chuyên đề</p>
                            </div>
                            <div class="flex items-center justify-between pt-3 border-t border-slate-100">
                                <button onclick="selectSubCourse('${sub.id}')" class="bg-slate-100 hover:bg-cyan-600 hover:text-white text-slate-700 text-sm px-4 py-2 rounded-lg font-medium transition">Xem Chi Tiết</button>
                    `;
                    if (isAdmin) {
                        html += `
                            <div class="flex gap-2">
                                <button onclick="editSubCourse('${sub.id}')" class="text-amber-600 hover:text-amber-800 text-xs px-2 py-1 bg-amber-50 rounded"><i class="fa-solid fa-pen"></i></button>
                                <button onclick="deleteSubCourse('${sub.id}')" class="text-rose-600 hover:text-rose-800 text-xs px-2 py-1 bg-rose-50 rounded"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        `;
                    }
                    html += `</div></div>`;
                });
            }
            html += `</div>`;
            return html;
        }

        function selectSubCourse(subCourseId) {
            selectedSubCourseId = subCourseId;
            currentView = 'sections';
            render();
        }

        // --- 3. GIAO DIỆN MỤC NHỎ VÀ VIDEO BÀI GIẢNG ---
        function renderSectionsView() {
            let course = courses.find(c => c.id === selectedCourseId);
            let sub = course ? course.subCourses.find(s => s.id === selectedSubCourseId) : null;
            if (!sub) return selectCourse(selectedCourseId);

            let html = `
                <div class="mb-6 flex justify-between items-center">
                    <div>
                        <h2 class="text-2xl font-bold text-slate-800">${sub.name}</h2>
                        <p class="text-sm text-slate-500">Danh sách các chương mục và video bài giảng chi tiết</p>
                    </div>
            `;
            if (isAdmin) {
                html += `<button onclick="addSection('${sub.id}')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow flex items-center gap-2"><i class="fa-solid fa-plus"></i> Thêm Mục Bài Học</button>`;
            }
            html += `</div><div class="space-y-4">`;

            if (!sub.sections || sub.sections.length === 0) {
                html += `<div class="text-center py-10 bg-white rounded-xl border border-slate-200 text-slate-500">Chưa có mục bài học nào.</div>`;
            } else {
                sub.sections.forEach(sec => {
                    html += `
                        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                            <div class="bg-slate-50 px-5 py-3 border-b border-slate-200 flex justify-between items-center">
                                <h3 class="font-bold text-slate-800 flex items-center gap-2"><i class="fa-solid fa-folder-open text-cyan-600"></i> ${sec.name}</h3>
                    `;
                    if (isAdmin) {
                        html += `
                            <div class="flex gap-2">
                                <button onclick="addVideo('${sec.id}')" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs px-2.5 py-1.5 rounded font-medium border border-emerald-200"><i class="fa-solid fa-video"></i> Thêm Video</button>
                                <button onclick="editSection('${sec.id}')" class="bg-amber-50 hover:bg-amber-100 text-amber-700 text-xs px-2.5 py-1.5 rounded font-medium border border-amber-200"><i class="fa-solid fa-pen"></i> Sửa</button>
                                <button onclick="deleteSection('${sec.id}')" class="bg-rose-50 hover:bg-rose-100 text-rose-700 text-xs px-2.5 py-1.5 rounded font-medium border border-rose-200"><i class="fa-solid fa-trash"></i> Xóa</button>
                            </div>
                        `;
                    }
                    html += `</div><div class="divide-y divide-slate-100">`;

                    if (!sec.videos || sec.videos.length === 0) {
                        html += `<div class="p-4 text-sm text-slate-400 text-center">Chưa có video bài giảng trong mục này.</div>`;
                    } else {
                        sec.videos.forEach(vid => {
                            html += `
                                <div class="p-4 flex items-center justify-between hover:bg-slate-50 transition">
                                    <div class="flex items-center space-x-3 cursor-pointer flex-grow" onclick="watchVideo('${sec.id}', '${vid.id}')">
                                        <div class="bg-cyan-100 text-cyan-600 w-9 h-9 rounded-full flex items-center justify-center font-bold flex-shrink-0">
                                            <i class="fa-solid fa-play text-xs"></i>
                                        </div>
                                        <div>
                                            <h4 class="font-medium text-slate-800 hover:text-cyan-600">${vid.title}</h4>
                                            <span class="text-xs text-slate-400">Xem video bài giảng</span>
                                        </div>
                                    </div>
                                    <div class="flex items-center gap-2">
                                        ${vid.docUrl ? `<a href="${vid.docUrl}" target="_blank" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs px-3 py-1.5 rounded font-medium flex items-center gap-1"><i class="fa-solid fa-file-lines text-cyan-600"></i> Tài liệu</a>` : ''}
                                        <button onclick="watchVideo('${sec.id}', '${vid.id}')" class="bg-cyan-600 hover:bg-cyan-700 text-white text-xs px-3 py-1.5 rounded font-medium">Xem ngay</button>
                            `;
                            if (isAdmin) {
                                html += `
                                    <button onclick="editVideo('${sec.id}', '${vid.id}')" class="bg-amber-50 text-amber-700 text-xs p-1.5 rounded hover:bg-amber-100" title="Sửa video"><i class="fa-solid fa-pen"></i></button>
                                    <button onclick="deleteVideo('${sec.id}', '${vid.id}')" class="bg-rose-50 text-rose-700 text-xs p-1.5 rounded hover:bg-rose-100" title="Xóa video"><i class="fa-solid fa-trash"></i></button>
                                `;
                            }
                            html += `</div></div>`;
                        });
                    }
                    html += `</div></div>`;
                });
            }
            html += `</div>`;
            return html;
        }

        // --- 4. GIAO DIỆN XEM VIDEO (Có tích hợp lớp phủ/overlay theo yêu cầu) ---
        function watchVideo(secId, vidId) {
            let course = courses.find(c => c.id === selectedCourseId);
            let sub = course.subCourses.find(s => s.id === selectedSubCourseId);
            let sec = sub.sections.find(sc => sc.id === secId);
            let vid = sec.videos.find(v => v.id === vidId);

            selectedVideo = vid;
            currentView = 'watch';
            render();
        }

        function renderWatchView() {
            let vid = selectedVideo;
            if (!vid) return goHome();

            // Chuyển đổi link youtube thường sang embed nếu cần
            let embedUrl = vid.url;
            if (embedUrl.includes("watch?v=")) {
                embedUrl = embedUrl.replace("watch?v=", "embed/");
            }

            let html = `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="lg:col-span-2">
                        <div class="bg-black rounded-xl overflow-hidden shadow-lg relative aspect-video flex items-center justify-center">
                            <!-- LỚP PHỦ (OVERLAY) NÚT MỞ RỘNG GÓC PHẢI TRÊN (Yêu cầu từ ảnh) -->
                            <a href="${vid.url}" target="_blank" class="overlay-btn" title="Mở rộng / Xem toàn màn hình">
                                <i class="fa-solid fa-up-right-from-square"></i>
                            </a>

                            <iframe src="${embedUrl}" class="w-full h-full border-0" allowfullscreen></iframe>
                        </div>
                        <div class="bg-white rounded-xl p-5 shadow-sm mt-4 border border-slate-200">
                            <h2 class="text-xl font-bold text-slate-800 mb-2">${vid.title}</h2>
                            <p class="text-sm text-slate-500">Chúc bạn có một buổi học tập hiệu quả cùng EMPIRE TEAM!</p>
                        </div>
                    </div>
                    <div class="bg-white rounded-xl p-5 shadow-sm border border-slate-200 h-fit">
                        <h3 class="font-bold text-slate-800 mb-4 pb-2 border-b border-slate-100 flex items-center gap-2">
                            <i class="fa-solid fa-file-lines text-cyan-600"></i> Tài liệu bài giảng
                        </h3>
            `;
            if (vid.docUrl) {
                html += `
                    <div class="p-3 bg-cyan-50 border border-cyan-100 rounded-lg flex items-center justify-between">
                        <span class="text-sm text-slate-700 font-medium truncate max-w-[200px]">Tài liệu đính kèm</span>
                        <a href="${vid.docUrl}" target="_blank" class="bg-cyan-600 hover:bg-cyan-700 text-white text-xs px-3 py-1.5 rounded-lg font-medium transition">Mở tài liệu</a>
                    </div>
                `;
            } else {
                html += `<p class="text-sm text-slate-400">Không có tài liệu đính kèm cho bài giảng này.</p>`;
            }
            html += `</div></div>`;
            return html;
        }

        // --- CÁC HÀM QUẢN TRỊ ADMIN (THÊM / SỬA / XÓA) ---

        // 1. Quản lý Khóa học lớn
        function addLargeCourse() {
            let name = prompt("Nhập tên khóa học lớn mới:");
            if (!name) return;
            let desc = prompt("Nhập mô tả khóa học:") || "";
            let image = prompt("Nhập link ảnh minh họa (URL):") || "https://images.unsplash.com/photo-1546410531-bb4caa6b424d?auto=format&fit=crop&w=600&q=80";
            let scheduleLink = prompt("Nhập link Google Drive/Sheet/Docs Thời khóa biểu:") || "";

            let newCourse = {
                id: 'course-' + Date.now(),
                name, desc, image, scheduleLink,
                subCourses: []
            };
            courses.push(newCourse);
            saveData();
            render();
        }

        function editLargeCourse(id) {
            let course = courses.find(c => c.id === id);
            if (!course) return;
            let name = prompt("Sửa tên khóa học lớn:", course.name);
            if (name === null) return;
            let desc = prompt("Sửa mô tả khóa học:", course.desc);
            let image = prompt("Sửa link ảnh minh họa:", course.image);

            course.name = name || course.name;
            course.desc = desc !== null ? desc : course.desc;
            course.image = image || course.image;
            saveData();
            render();
        }

        function deleteLargeCourse(id) {
            if (confirm("Bạn có chắc chắn muốn xóa khóa học lớn này và toàn bộ dữ liệu bên trong?")) {
                courses = courses.filter(c => c.id !== id);
                saveData();
                render();
            }
        }

        // 2. Quản lý Link Thời Khóa Biểu
        function editScheduleLink(courseId) {
            let course = courses.find(c => c.id === courseId);
            if (!course) return;
            let link = prompt("Nhập link Google Drive, Sheet hoặc Docs mới cho Thời Khóa Biểu:", course.scheduleLink || "");
            if (link !== null) {
                course.scheduleLink = link;
                saveData();
                render();
                alert("Đã cập nhật link Thời Khóa Biểu thành công!");
            }
        }

        // 3. Quản lý Khóa học nhỏ
        function addSubCourse(courseId) {
            let course = courses.find(c => c.id === courseId);
            if (!course) return;
            let name = prompt("Nhập tên khóa học nhỏ/chuyên mục:");
            if (!name) return;

            let newSub = {
                id: 'sub-' + Date.now(),
                name,
                sections: []
            };
            course.subCourses.push(newSub);
            saveData();
            render();
        }

        function editSubCourse(subId) {
            let course = courses.find(c => c.id === selectedCourseId);
            let sub = course.subCourses.find(s => s.id === subId);
            if (!sub) return;
            let name = prompt("Sửa tên khóa học nhỏ:", sub.name);
            if (name) {
                sub.name = name;
                saveData();
                render();
            }
        }

        function deleteSubCourse(subId) {
            let course = courses.find(c => c.id === selectedCourseId);
            if (confirm("Bạn có chắc chắn muốn xóa khóa học nhỏ này?")) {
                course.subCourses = course.subCourses.filter(s => s.id !== subId);
                saveData();
                render();
            }
        }

        // 4. Quản lý Mục (Sections)
        function addSection(subId) {
            let course = courses.find(c => c.id === selectedCourseId);
            let sub = course.subCourses.find(s => s.id === subId);
            let name = prompt("Nhập tên mục/chương bài học:");
            if (!name) return;

            let newSec = {
                id: 'sec-' + Date.now(),
                name,
                videos: []
            };
            sub.sections.push(newSec);
            saveData();
            render();
        }

        function editSection(secId) {
            let course = courses.find(c => c.id === selectedCourseId);
            let sub = course.subCourses.find(s => s.id === selectedSubCourseId);
            let sec = sub.sections.find(s => s.id === secId);
            let name = prompt("Sửa tên mục:", sec.name);
            if (name) {
                sec.name = name;
                saveData();
                render();
            }
        }

        function deleteSection(secId) {
            let course = courses.find(c => c.id === selectedCourseId);
            let sub = course.subCourses.find(s => s.id === selectedSubCourseId);
            if (confirm("Xóa mục này và toàn bộ video bài giảng bên trong?")) {
                sub.sections = sub.sections.filter(s => s.id !== secId);
                saveData();
                render();
            }
        }

        // 5. Quản lý Video Bài Giảng & Tài Liệu
        function addVideo(secId) {
            let course = courses.find(c => c.id === selectedCourseId);
            let sub = course.subCourses.find(s => s.id === selectedSubCourseId);
            let sec = sub.sections.find(s => s.id === secId);

            let title = prompt("Nhập tiêu đề video bài giảng:");
            if (!title) return;
            let url = prompt("Nhập link video (Youtube embed hoặc link xem):", "https://www.youtube.com/embed/dQw4w9WgXcQ");
            if (!url) return;
            let docUrl = prompt("Nhập link tài liệu đính kèm (Google Drive/Docs/PDF) - tùy chọn:", "") || "";

            let newVid = {
                id: 'vid-' + Date.now(),
                title, url, docUrl
            };
            sec.videos.push(newVid);
            saveData();
            render();
        }

        function editVideo(secId, vidId) {
            let course = courses.find(c => c.id === selectedCourseId);
            let sub = course.subCourses.find(s => s.id === selectedSubCourseId);
            let sec = sub.sections.find(s => s.id === secId);
            let vid = sec.videos.find(v => v.id === vidId);

            let title = prompt("Sửa tiêu đề video:", vid.title);
            if (title === null) return;
            let url = prompt("Sửa link video:", vid.url);
            let docUrl = prompt("Sửa link tài liệu đính kèm:", vid.docUrl || "");

            vid.title = title || vid.title;
            vid.url = url || vid.url;
            vid.docUrl = docUrl !== null ? docUrl : vid.docUrl;
            saveData();
            render();
        }

        function deleteVideo(secId, vidId) {
            let course = courses.find(c => c.id === selectedCourseId);
            let sub = course.subCourses.find(s => s.id === selectedSubCourseId);
            let sec = sub.sections.find(s => s.id === secId);
            if (confirm("Bạn có muốn xóa video bài giảng này không?")) {
                sec.videos = sec.videos.filter(v => v.id !== vidId);
                saveData();
                render();
            }
        }

        // Khởi chạy ứng dụng lần đầu
        render();
    </script>
</body>
</html>
